<div style="text-align:center;padding-top:32px">

</div>
<ul style="list-style:none;padding:0;margin:28px 0">
  <li class="box" style="margin:10px 0;padding:10px 14px"><strong>宣言</strong>：何を勉強するか、予定の分数を宣言します。</li>
  <li class="box" style="margin:10px 0;padding:10px 14px"><strong>完了を報告</strong>：勉強が終わったら、完了を報告します。</li>

</ul>
<p style="font-size:14px;color:var(--sub)">学生や学び手の方向けのアプリです。13歳未満の方は利用できません。</p>
